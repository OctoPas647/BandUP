<script>
/* iPhone/PWA extras: offline cache, theme-coloured browser chrome, install hint */
(function () {
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(function () {});
  var meta = document.querySelector('meta[name="theme-color"]');
  var sync = function () { var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(); if (/^#[0-9a-f]{6}$/i.test(bg) && meta.content !== bg) meta.content = bg; };
  sync(); new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ['style', 'data-theme'] });
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { setTimeout(sync, 50); });
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var standalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  var seen = false; try { seen = localStorage.getItem('bandup-ioshint') === '1'; } catch (e) {}
  if (ios && !standalone && !seen) setTimeout(function () {
    var d = document.createElement('div'); d.className = 'ioshint'; d.setAttribute('role', 'status');
    d.innerHTML = '<span>Install BandUp: tap <b>Share</b> \u2191 then <b>Add to Home Screen</b>. It works offline.</span><button type="button" aria-label="Dismiss">\u00d7</button>';
    d.querySelector('button').onclick = function () { d.remove(); try { localStorage.setItem('bandup-ioshint', '1'); } catch (e) {} };
    document.body.appendChild(d);
  }, 1500);
})();
</script>
